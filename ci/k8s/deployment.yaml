apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: orbit
  labels:
    app: core
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      imagePullSecrets:
        - name: harbor-secret

      containers:
        - name: core
          image: 192.168.26.180/orbit/core:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 30701
              protocol: TCP

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          # 启动探针
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # 就绪探针
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # 存活探针
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
