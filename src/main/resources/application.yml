spring:
    application:
        name: core
    profiles:
        active: dev
    cloud:
        compatibility-verifier:
            enabled: false
        nacos:
            config:
                server-addr: 192.168.26.160:30848
                username: nacos
                password: zaq1@WSX
                namespace: DEV_H160
                file-extension: yml
    config:
        import:
            - nacos:datasource.yml
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://${datasource.mysql.host}:${datasource.mysql.port}/${spring.application.name}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
        username: ${datasource.mysql.username}
        password: ${datasource.mysql.password}
    data:
        redis:
            host: ${datasource.redis.host}
            port: ${datasource.redis.port}
            password: ${datasource.redis.password}
            database: 0
            lettuce:
                pool:
                    max-active: 8
                    max-idle: 8
                    min-idle: 0
    liquibase:
        enabled: true
        change-log: classpath:db/changelog/db.changelog-master.yml

server:
    port: 30701

mybatis-plus:
    configuration:
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
