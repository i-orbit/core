spring:
  application:
    name: core
  profiles:
    active: dev
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      config:
        server-addr: 192.168.26.160:30848
        username: nacos
        password: zaq1@WSX
        namespace: DEV_H160
        file-extension: yml
  config:
    import:
      - nacos:datasource.yml
      - nacos:security.yml
      - nacos:kafka.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${datasource.mysql.host}:${datasource.mysql.port}/${spring.application.name}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${datasource.mysql.username}
    password: ${datasource.mysql.password}
  data:
    redis:
      host: ${datasource.redis.host}
      port: ${datasource.redis.port}
      password: ${datasource.redis.password}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    producer:
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 60000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"

    listener:
      type: batch
      ack-mode: manual
  aop:
    proxy-target-class: true

server:
  port: 30701

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
